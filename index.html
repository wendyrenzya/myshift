<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FBF9F5" />
  <meta name="google-site-verification" content="k-cLzlx4zcfpT1_a_jnVbpyt0ZAOXiemilB2EgmVCo8" />
  <meta name="description" content="MyShift adalah aplikasi gratis untuk mengatur jadwal shift tim kerja — kantor, ronda malam, atau kebutuhan jadwal bergilir mingguan lainnya. Tanpa akun, tanpa backend — semua data tersimpan langsung di perangkat kamu." />
  <meta property="og:title" content="MyShift — Aplikasi Jadwal Shift Tim" />
  <meta property="og:description" content="Atur jadwal shift tim kamu — kantor, ronda malam, apa aja — tanpa ribet dan tanpa perlu akun." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://myshift.my.id" />
  <link rel="icon" type="image/png" href="/myshift_splash.png" />

  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MyShift" />
  <title>MyShift</title>
  <style>
    #pl-splash {
      position: fixed; inset: 0; z-index: 9999;
      background: #FBF9F5; display: flex; align-items: center; justify-content: center;
      animation: pl-splash-fade .4s ease-out .9s forwards;
    }
    #pl-splash-wrap { position: relative; width: 96px; height: 96px; }
    #pl-splash-ring {
      position: absolute; inset: 0; z-index: 1; border-radius: 24px;
      border: 3px solid #FF7F50; opacity: 0;
      animation: pl-splash-ring-pulse .9s cubic-bezier(.2,.7,.3,1) .1s forwards;
    }
    #pl-splash img {
      position: relative; z-index: 2; width: 96px; height: 96px; border-radius: 24px;
      box-shadow: 0 8px 24px rgba(26,43,72,.25); opacity: 0;
      animation: pl-splash-unwind .7s cubic-bezier(.34,1.4,.4,1) forwards;
    }
    @keyframes pl-splash-unwind {
      0% { opacity: 0; transform: scale(.3) rotate(-200deg); }
      60% { opacity: 1; transform: scale(1.08) rotate(8deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes pl-splash-ring-pulse {
      0% { opacity: .9; transform: scale(.6); }
      70% { opacity: .25; }
      100% { opacity: 0; transform: scale(2.2); }
    }
    @keyframes pl-splash-fade { to { opacity: 0; visibility: hidden; pointer-events: none; } }
  </style>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="pl-splash"><div id="pl-splash-wrap"><div id="pl-splash-ring"></div><img src="/myshift_splash.png" alt="MyShift" /></div></div>
  <div id="app">
    <div style="max-width:420px;margin:40px auto;padding:24px 20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center;color:#1A1A1A">
      <img src="/myshift_splash.png" alt="MyShift" style="width:64px;height:64px;margin:0 auto 16px;border-radius:50%;display:block;box-shadow:0 2px 8px rgba(0,0,0,.06)" />
      <h1 style="margin:0 0 8px;font-size:1.5rem;font-weight:700;letter-spacing:-0.01em">MyShift</h1>
      <p style="margin:0 0 24px;font-size:.9rem;color:#6B6B6B;line-height:1.6;max-width:320px;margin-left:auto;margin-right:auto">Aplikasi gratis untuk mengatur jadwal shift tim kerja — kantor, ronda malam, atau kebutuhan jadwal bergilir mingguan lainnya. Tanpa akun, tanpa backend — semua data tersimpan langsung di perangkat kamu.</p>
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <div style="flex:1;background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#1A2B48">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span style="font-size:.72rem;font-weight:600;color:#1A1A1A;line-height:1.3">Banyak Jadwal</span>
        </div>
        <div style="flex:1;background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#1A2B48">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          <span style="font-size:.72rem;font-weight:600;color:#1A1A1A;line-height:1.3">Bagikan Sekali Tap</span>
        </div>
        <div style="flex:1;background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#1A2B48">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span style="font-size:.72rem;font-weight:600;color:#1A1A1A;line-height:1.3">Backup Kapan Aja</span>
        </div>
      </div>
      <p style="margin:20px 0 0"><a href="/privacy" style="color:#1A2B48;font-weight:600;font-size:.85rem">Kebijakan Privasi</a></p>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
